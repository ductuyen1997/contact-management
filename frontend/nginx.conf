server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Using a variable in proxy_pass makes nginx re-resolve the name
    # (every 10s) instead of caching the gateway's IP forever, which breaks when the container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8090;

    # API calls go to the gateway (same origin for the browser -> no CORS needed)
    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths serve the SPA shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
