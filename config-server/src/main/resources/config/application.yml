# Shared by every client of the config server.
# ${...} placeholders are resolved on the client side, so each container can override them via env vars.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

spring:
  mvc:
    problemdetails:
      enabled: true   # RFC 9457 error bodies for framework exceptions
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

messaging:
  contact-topic: contact.events
  replicas: ${KAFKA_REPLICAS:3}   # copies of each partition; must not exceed the number of brokers

logging:
  level:
    com.example: INFO

# JWT settings shared by auth-service (signs tokens) and the gateway + services (validate them).
# The default secret is for local development only: set JWT_SECRET (32+ characters) on every service in production.
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-contact-manager-jwt-secret}
    issuer: contact-manager-auth
    ttl: ${JWT_TTL:8h}
