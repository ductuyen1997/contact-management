# Shared by every client of the config server.
# ${...} placeholders are resolved on the client side, so each container can override them via env vars.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

spring:
  mvc:
    problemdetails:
      enabled: true   # RFC 9457 error bodies for framework exceptions
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

messaging:
  contact-exchange: contact.events

logging:
  level:
    com.example: INFO
