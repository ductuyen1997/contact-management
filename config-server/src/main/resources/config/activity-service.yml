spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/activity_db
    username: ${ACTIVITY_DB_USER:activity_user}
    password: ${ACTIVITY_DB_PASSWORD:activity_pass}
  kafka:
    consumer:
      group-id: activity-service      # every instance shares the work; offsets are tracked per group
      auto-offset-reset: earliest     # a brand-new group starts from the oldest retained event
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:                         # used only to publish failed records to the dead-letter topic
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

messaging:
  contact-dlt: contact.events.dlt   # records that still fail after retries
