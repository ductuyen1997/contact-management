spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/activity_db
    username: ${ACTIVITY_DB_USER:activity_user}
    password: ${ACTIVITY_DB_PASSWORD:activity_pass}
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false   # failed messages go to the dead-letter queue
        retry:
          enabled: true
          max-attempts: 3

messaging:
  activity-queue: activity.contact-events
