server:
  port: 8092

spring:
  application:
    name: activity-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      # fail-fast overrides "optional:" when the client is enabled: without config the service would
      # run with no routes/datasource, so exit and let Docker's restart policy retry. (Tests disable the client.)
      fail-fast: true
