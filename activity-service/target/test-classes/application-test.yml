spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:activity;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    listener:
      simple:
        auto-startup: false   # no broker in tests; the listener is exercised directly

eureka:
  client:
    enabled: false

messaging:
  contact-exchange: contact.events
  activity-queue: activity.contact-events
