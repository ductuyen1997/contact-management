spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:contacts;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    admin:
      auto-create: false      # no broker in tests: don't try to create topics

eureka:
  client:
    enabled: false

messaging:
  contact-topic: contact.events

app:
  page-size: 10
  seed-data: true

security:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
    issuer: contact-manager-auth
