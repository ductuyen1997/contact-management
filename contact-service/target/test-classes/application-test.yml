spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:contacts;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

eureka:
  client:
    enabled: false

messaging:
  contact-exchange: contact.events

app:
  page-size: 10
  seed-data: true
